<!DOCTYPE html>
<html class="dark">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavePlate: Investor Demo Ready</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'harvest-green': '#10B981', 
                        'sky-blue': '#3B82F6', 
                        'alert-red': '#EF4444',
                        'warn-yellow': '#F59E0B'
                    }
                }
            }
        }
    </script>

    <style>
        /* Smooth transition for theme switching */
        body, div, p, h1, h2, h3, button, input {
            transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s, color 0.3s;
        }
        
        /* Loading Animation */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #10B981; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <div id="app-container" class="w-full flex-1 flex flex-col"></div>

    <div id="chat-modal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4">
        <div class="w-full max-w-md rounded-2xl overflow-hidden flex flex-col h-[500px] shadow-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
            <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900">
                <h3 id="chat-title" class="font-bold">Chat</h3>
                <button onclick="closeChat()" class="text-slate-400 hover:text-red-500"><i class="ph-bold ph-x"></i></button>
            </div>
            <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 dark:bg-slate-900"></div>
            <div class="p-3 border-t border-slate-200 dark:border-slate-700 flex gap-2 bg-white dark:bg-slate-800">
                <input id="chatMessage" class="flex-1 bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white rounded-xl px-4 py-2 border-transparent focus:border-harvest-green outline-none" placeholder="Type message..." onkeydown="if(event.key === 'Enter') sendChat()">
                <button onclick="sendChat()" class="bg-harvest-green text-white p-2 rounded-xl hover:bg-green-600"><i class="ph-bold ph-paper-plane-right"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBhIGuenJfzmvIJA0efkoJNG9Ufll6b98",
            authDomain: "savepalte.firebaseapp.com",
            projectId: "savepalte",
            storageBucket: "savepalte.firebasestorage.app",
            messagingSenderId: "126532668430",
            appId: "1:126532668430:web:f8fbbcb6e8ebf3ed05805f",
            measurementId: "G-DVNZWKX02T"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.dbOps = { collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, where, onSnapshot };
            console.log("🔥 System Ready");
        } catch (e) { console.error("DB Init Error:", e); }

        // --- STATE ---
        window.STATE = { user: null, currentPage: 'login', listings: [], reservations: [], currentChatId: null, tempImage: null, searchQuery: '', unsubscribe: null, isLoading: false };
        const getEl = (id) => document.getElementById(id);
        
        window.calculatePrice = (original, discountStr) => {
            let discount = 0;
            if(discountStr && discountStr.includes('%')) discount = parseFloat(discountStr.replace('%', '')) / 100;
            const final = original * (1 - discount);
            return { original: parseFloat(original).toFixed(2), final: final.toFixed(2) };
        }

        // --- THEME LOGIC (FIXED: Using Class List) ---
        window.toggleTheme = () => {
            const html = document.documentElement;
            html.classList.toggle('dark');
            try {
                localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            } catch(e) {}
            // Update icon immediately
            const icon = document.getElementById('theme-icon');
            if(icon) icon.className = html.classList.contains('dark') ? 'ph-bold ph-sun text-xl' : 'ph-bold ph-moon-stars text-xl';
        }
        
        // Initial Theme Load
        try {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        } catch(e) {}

        // --- ANALYTICS ---
        function calculateAnalytics(sales) {
            const totalRevenue = sales.reduce((sum, order) => sum + (order.finalPrice || 0), 0);
            const totalSales = sales.length;
            const avgOrderValue = totalSales > 0 ? (totalRevenue / totalSales) : 0;
            const itemCounts = {};
            sales.forEach(s => { itemCounts[s.foodName] = (itemCounts[s.foodName] || 0) + 1; });
            let topItem = "None";
            let maxCount = 0;
            for(const [name, count] of Object.entries(itemCounts)) { if(count > maxCount) { maxCount = count; topItem = name; } }
            return { totalRevenue, totalSales, avgOrderValue, topItem };
        }

        // --- COMPONENTS (Using Tailwind Classes Directly) ---
        const ListingCard = (l) => {
            const price = window.calculatePrice(l.originalPrice, l.discount || '0%');
            return `
            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden group hover:border-harvest-green transition-all duration-300 shadow-sm">
                <div class="h-48 bg-gray-700 relative">
                    <img src="${l.image || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
                    <div class="absolute top-2 right-2 bg-alert-red text-white text-xs font-bold px-2 py-1 rounded">${l.discount || '0%'}</div>
                </div>
                <div class="p-5">
                    <h3 class="font-bold text-lg truncate">${l.foodName}</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-4 flex items-center gap-1"><i class="ph-fill ph-map-pin"></i> ${l.location || 'Pickup'}</p>
                    <div class="flex justify-between items-end">
                        <div class="flex flex-col">
                            <span class="text-xs text-slate-400 line-through">RM ${price.original}</span>
                            <span class="text-2xl font-bold text-harvest-green">RM ${price.final}</span>
                        </div>
                        <button onclick="reserveFood('${l.id}')" class="px-4 py-2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold rounded-lg hover:opacity-90 active:scale-95 transition">Buy</button>
                    </div>
                </div>
            </div>`;
        }

        const OrderCard = (r) => {
            let statusColor = 'text-sky-500 bg-sky-500/10';
            if(r.status === 'Ready') statusColor = 'text-harvest-green bg-harvest-green/10';
            if(r.status === 'Completed') statusColor = 'text-slate-500 bg-slate-500/10';
            if(r.status === 'Cancelled') statusColor = 'text-alert-red bg-alert-red/10';

            return `
            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 border-l-4 ${r.status === 'Cancelled' ? 'border-alert-red' : 'border-sky-blue'} shadow-sm">
                <div class="w-full">
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-xl">${r.foodName}</h3>
                        <span class="${statusColor} text-xs px-2 py-1 rounded font-bold uppercase tracking-wider">${r.status || 'Pending'}</span>
                    </div>
                    <p class="text-sm text-slate-500 dark:text-slate-400">Order ID: ${r.id.slice(0,8)}</p>
                    <p class="font-bold mt-1">RM ${r.finalPrice}</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    ${(r.status === 'Pending' || !r.status) ? <button onclick="cancelOrder('${r.id}')" class="flex-1 md:flex-none border border-alert-red text-alert-red hover:bg-alert-red hover:text-white px-4 py-2 rounded-lg font-bold text-sm transition">Cancel</button> : ''}
                    <button onclick="openChatPopup('${r.id}', 'Seller')" class="flex-1 md:flex-none bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-4 py-2 rounded-lg font-bold flex justify-center items-center gap-2 transition">
                        <i class="ph-fill ph-chat-circle-text"></i> Chat
                    </button>
                </div>
            </div>`;
        }

        const SalesCard = (order) => {
            let status = order.status || 'Pending';
            let actionBtn = '';

            if (status === 'Pending') {
                actionBtn = <button onclick="updateStatus('${order.id}', 'Ready')" class="bg-sky-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-sky-500">Mark Ready</button>;
            } else if (status === 'Ready') {
                actionBtn = <button onclick="updateStatus('${order.id}', 'Completed')" class="bg-harvest-green text-white text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-green-600">Complete</button>;
            } else {
                actionBtn = <span class="text-slate-400 text-xs italic">Closed</span>;
            }

            return `
            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-xl flex justify-between items-center border-l-4 ${status === 'Cancelled' ? 'border-alert-red' : 'border-harvest-green'} shadow-sm">
                <div>
                    <p class="font-bold">${order.foodName}</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Buyer: ${order.buyerUsername}</p>
                    <p class="text-xs font-bold mt-1 ${status === 'Cancelled' ? 'text-alert-red' : 'text-sky-500'}">Status: ${status}</p>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <span class="font-bold text-harvest-green">+ RM ${order.finalPrice}</span>
                    <div class="flex gap-2">
                        ${status !== 'Cancelled' ? actionBtn : ''}
                        <button onclick="openChatPopup('${order.id}', '${order.buyerUsername}')" class="text-slate-400 hover:text-white"><i class="ph-fill ph-chat-circle-dots text-xl"></i></button>
                    </div>
                </div>
            </div>`;
        }

        const RewardCard = (r) => {
            return `
            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-6 rounded-2xl text-center hover:border-harvest-green transition cursor-pointer shadow-sm" onclick="redeemReward(${r.cost}, '${r.name}')">
                <i class="ph-fill ${r.icon} text-4xl text-harvest-green mb-4"></i>
                <h3 class="font-bold text-lg">${r.name}</h3>
                <p class="text-slate-500 dark:text-slate-400 font-bold mt-2">${r.cost} PTS</p>
            </div>`;
        }

        const ChatBubble = (msg, isMe) => {
            return `
            <div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-2">
                <div class="${isMe ? 'bg-harvest-green text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-900 dark:text-slate-100'} px-4 py-2 rounded-2xl max-w-[80%] text-sm shadow-sm">
                    <p class="font-bold text-[10px] opacity-70 mb-0.5 uppercase tracking-wider">${msg.user}</p>
                    ${msg.text}
                </div>
            </div>`;
        }

        // --- ACTIONS ---

        window.login = async () => {
            const userIn = getEl('username')?.value?.trim();
            const roleIn = getEl('role')?.value;
            if(!userIn) return alert("Enter username");

            try {
                const { collection, addDoc, getDocs, query, where } = window.dbOps;
                const q = query(collection(window.db, "users"), where("username", "==", userIn));
                const snap = await getDocs(q);
                
                if(!snap.empty) {
                    window.STATE.user = { ...snap.docs[0].data(), docId: snap.docs[0].id };
                } else {
                    const newUser = { username: userIn, role: roleIn, points: 0, bio: 'New Food Saver', avatar: 'https://via.placeholder.com/150', sellerId: roleIn === 'seller' ? 'sell_'+userIn : null };
                    const ref = await addDoc(collection(window.db, "users"), newUser);
                    window.STATE.user = { ...newUser, docId: ref.id };
                }

                window.STATE.currentPage = window.STATE.user.role === 'buyer' ? 'home' : 'seller-analytics';
                window.STATE.isLoading = true; renderApp();
                await syncData();
                window.STATE.isLoading = false; renderApp();
            } catch(e) { console.error(e); alert("Login Error"); }
        }

        window.logout = () => { window.STATE.user = null; window.STATE.currentPage = 'login'; renderApp(); }
        window.handlePageChange = (page) => { window.STATE.currentPage = page; renderApp(); }

        async function syncData() {
            if(!window.db) return;
            const { collection, getDocs, query, where } = window.dbOps;
            const lSnap = await getDocs(collection(window.db, "listings"));
            window.STATE.listings = [];
            lSnap.forEach(d => window.STATE.listings.push({ ...d.data(), id: d.id }));
            
            window.STATE.reservations = [];
            if(window.STATE.user) {
                const field = window.STATE.user.role === 'buyer' ? 'buyerUsername' : 'sellerId';
                const value = window.STATE.user.role === 'buyer' ? window.STATE.user.username : window.STATE.user.sellerId;
                const oSnap = await getDocs(query(collection(window.db, "reservations"), where(field, "==", value)));
                oSnap.forEach(d => window.STATE.reservations.push({ ...d.data(), id: d.id }));
            }
        }

        window.addListing = async () => {
            const name = getEl('foodName').value;
            const price = parseFloat(getEl('originalPrice').value);
            if(!name || !price) return alert("Missing info");
            const item = {
                foodName: name, originalPrice: price, discount: getEl('discount').value || '0%', 
                expiry: getEl('expiry').value || '', location: getEl('location').value || '',
                sellerId: window.STATE.user.sellerId, image: window.STATE.tempImage || 'https://via.placeholder.com/300',
                createdAt: new Date().toISOString()
            };
            await window.dbOps.addDoc(window.dbOps.collection(window.db, "listings"), item);
            await syncData(); window.handlePageChange('seller-analytics');
        }

        window.reserveFood = async (id) => {
            const item = window.STATE.listings.find(l => l.id === id);
            const priceData = window.calculatePrice(item.originalPrice, item.discount || '0%');
            if(confirm(Buy for RM ${priceData.final}?)) {
                const order = {
                    listingId: id, foodName: item.foodName, sellerId: item.sellerId,
                    buyerUsername: window.STATE.user.username, finalPrice: parseFloat(priceData.final), 
                    status: 'Pending', 
                    timestamp: new Date().toISOString(),
                    listingSnapshot: item
                };
                await window.dbOps.addDoc(window.dbOps.collection(window.db, "reservations"), order);
                await window.dbOps.deleteDoc(window.dbOps.doc(window.db, "listings", id));
                const userRef = window.dbOps.doc(window.db, "users", window.STATE.user.docId);
                const newPoints = (window.STATE.user.points || 0) + 50;
                await window.dbOps.updateDoc(userRef, { points: newPoints });
                window.STATE.user.points = newPoints;
                await syncData(); renderApp(); alert("Order Placed! Wait for seller confirmation.");
            }
        }

        window.cancelOrder = async (id) => {
            if(!confirm("Cancel this order? Food will return to homepage.")) return;
            try {
                const orderRef = window.dbOps.doc(window.db, "reservations", id);
                await window.dbOps.updateDoc(orderRef, { status: 'Cancelled' });
                
                const order = window.STATE.reservations.find(r => r.id === id);
                if(order && order.listingSnapshot) {
                    const restoredItem = { ...order.listingSnapshot };
                    delete restoredItem.id; 
                    await window.dbOps.addDoc(window.dbOps.collection(window.db, "listings"), restoredItem);
                }

                const userRef = window.dbOps.doc(window.db, "users", window.STATE.user.docId);
                const newPoints = Math.max(0, (window.STATE.user.points || 0) - 50);
                await window.dbOps.updateDoc(userRef, { points: newPoints });
                window.STATE.user.points = newPoints;

                await syncData(); renderApp();
            } catch(e) { console.error(e); alert("Error cancelling"); }
        }

        window.updateStatus = async (id, status) => {
            try {
                const orderRef = window.dbOps.doc(window.db, "reservations", id);
                await window.dbOps.updateDoc(orderRef, { status: status });
                await syncData(); renderApp();
            } catch(e) { console.error(e); }
        }

        window.updateProfile = async () => {
            const newBio = getEl('bioInput').value;
            const newAvatar = window.STATE.tempImage || window.STATE.user.avatar;
            try {
                const userRef = window.dbOps.doc(window.db, "users", window.STATE.user.docId);
                await window.dbOps.updateDoc(userRef, { bio: newBio, avatar: newAvatar });
                window.STATE.user.bio = newBio; window.STATE.user.avatar = newAvatar; window.STATE.tempImage = null;
                alert("Profile Updated!"); renderApp();
            } catch(e) { console.error(e); alert("Update failed"); }
        }

        window.redeemReward = async (cost, name) => {
            if((window.STATE.user.points || 0) >= cost) {
                if(!confirm(Redeem ${name}?)) return;
                const userRef = window.dbOps.doc(window.db, "users", window.STATE.user.docId);
                const newPoints = window.STATE.user.points - cost;
                await window.dbOps.updateDoc(userRef, { points: newPoints });
                window.STATE.user.points = newPoints;
                renderApp(); alert(Redeemed ${name}!);
            } else { alert("Not enough points!"); }
        }

        // --- REAL-TIME CHAT ---
        window.openChatPopup = (id, title) => {
            window.STATE.currentChatId = id;
            getEl('chat-title').innerText = title;
            getEl('chat-history').innerHTML = '<p class="text-center opacity-50 mt-10">Loading...</p>';
            getEl('chat-modal').classList.remove('hidden');
            if(window.STATE.unsubscribe) window.STATE.unsubscribe();
            const { collection, query, where, onSnapshot } = window.dbOps;
            const q = query(collection(window.db, "messages"), where("transactionId", "==", id));
            window.STATE.unsubscribe = onSnapshot(q, (snapshot) => {
                const msgs = []; snapshot.forEach(doc => msgs.push(doc.data()));
                msgs.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
                getEl('chat-history').innerHTML = msgs.map(m => ChatBubble(m, m.user === window.STATE.user.username)).join('') || '<p class="text-center opacity-50 mt-10">Start chatting!</p>';
                getEl('chat-history').scrollTop = getEl('chat-history').scrollHeight;
            });
        }
        window.closeChat = () => { getEl('chat-modal').classList.add('hidden'); if(window.STATE.unsubscribe) window.STATE.unsubscribe(); }
        window.sendChat = async () => {
            const input = getEl('chatMessage'); const txt = input.value.trim(); if(!txt) return;
            await window.dbOps.addDoc(window.dbOps.collection(window.db, "messages"), { transactionId: window.STATE.currentChatId, user: window.STATE.user.username, text: txt, timestamp: new Date().toISOString() });
            input.value = '';
        }
        window.handleImageUpload = (input) => {
            const file = input.files[0];
            if(file) { const reader = new FileReader(); reader.onload = (e) => { window.STATE.tempImage = e.target.result; getEl('image-preview').src = window.STATE.tempImage; getEl('image-preview').classList.remove('hidden'); getEl('upload-placeholder').classList.add('hidden'); }; reader.readAsDataURL(file); }
        }
        window.handleSearch = (val) => { window.STATE.searchQuery = val.toLowerCase(); const grid = document.getElementById('listings-grid'); if(grid) grid.innerHTML = window.STATE.listings.filter(l => l.foodName.toLowerCase().includes(window.STATE.searchQuery)).map(l => ListingCard(l)).join('') || '<p class="col-span-full text-center text-slate-500">No matches.</p>'; }

        // --- RENDER ---
        function renderApp() {
            const container = getEl('app-container');
            if(!container) return;
            
            // Icon Logic
            const isDark = document.documentElement.classList.contains('dark');
            const themeIcon = isDark ? 'ph-sun' : 'ph-moon-stars';

            if(window.STATE.currentPage === 'login') {
                container.innerHTML = `
                <div class="flex min-h-screen items-center justify-center p-4 bg-[url('https://images.unsplash.com/photo-1495195134817-aeb325a55b65?q=80&w=2676&auto=format&fit=crop')] bg-cover bg-center">
                    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
                    <div class="bg-white dark:bg-slate-800 w-full max-w-md p-8 rounded-3xl relative z-10 shadow-2xl border border-slate-200 dark:border-slate-700">
                        <h1 class="text-4xl font-extrabold mb-2 flex items-center gap-2"><i class="ph-fill ph-plant text-harvest-green"></i> SavePlate</h1>
                        <div class="space-y-4 mt-8">
                            <div><label class="text-xs font-bold uppercase opacity-70">Username</label><input id="username" type="text" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white p-3 rounded-xl mt-1 outline-none focus:border focus:border-harvest-green" placeholder="Enter username"></div>
                            <div><label class="text-xs font-bold uppercase opacity-70">Role</label><select id="role" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white p-3 rounded-xl mt-1 outline-none"><option value="buyer">Buyer</option><option value="seller">Seller</option></select></div>
                            <button onclick="login()" class="w-full bg-harvest-green text-white font-bold py-3 rounded-xl hover:bg-green-600 transition mt-4">Start Saving</button>
                        </div>
                    </div>
                </div>`;
                return;
            }

            const isBuyer = window.STATE.user.role === 'buyer';
            const headerHTML = `
            <header class="glass-header px-6 py-4 flex justify-between items-center shadow-sm">
                <div class="flex items-center gap-4">
                    <h1 class="text-2xl font-black cursor-pointer" onclick="handlePageChange('${isBuyer ? 'home' : 'seller-analytics'}')">SavePlate<span class="text-harvest-green">.</span></h1>
                    ${isBuyer ? <div class="bg-green-900/10 dark:bg-green-900/30 px-3 py-1 rounded-full border border-green-500/30 text-green-600 dark:text-green-400 text-sm font-bold">${window.STATE.user.points || 0} PTS</div> : ''}
                </div>
                <nav class="flex items-center gap-4 text-sm font-medium">
                    <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Toggle Theme"><i id="theme-icon" class="ph-bold ${themeIcon} text-xl"></i></button>
                    <button onclick="handlePageChange('profile')" class="hover:text-green-400 ${window.STATE.currentPage === 'profile' ? 'text-green-400' : ''}"><i class="ph-fill ph-user text-xl"></i></button>
                    ${isBuyer 
                        ? `<button onclick="handlePageChange('home')" class="hover:text-green-400 ${window.STATE.currentPage === 'home' ? 'text-green-400' : ''}">Food</button>
                           <button onclick="handlePageChange('orders')" class="hover:text-green-400 ${window.STATE.currentPage === 'orders' ? 'text-green-400' : ''}">Orders</button>
                           <button onclick="handlePageChange('rewards')" class="hover:text-green-400 ${window.STATE.currentPage === 'rewards' ? 'text-green-400' : ''}">Rewards</button>` 
                        : <button onclick="handlePageChange('seller-analytics')" class="hover:text-green-400">Dashboard</button>
                    }
                    <button onclick="logout()" class="text-red-400 hover:text-red-300">Exit</button>
                </nav>
            </header>`;

            let contentHTML = '';
            if(window.STATE.isLoading) {
                contentHTML = <div class="flex justify-center items-center h-64"><div class="loader"></div><span class="ml-3 opacity-70">Loading...</span></div>;
            } 
            
            else if(window.STATE.currentPage === 'home') {
                contentHTML = `
                <div class="p-6 pt-8 max-w-6xl mx-auto w-full">
                    <div class="mb-8 relative">
                        <i class="ph-bold ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 opacity-50 text-xl"></i>
                        <input id="search-input" class="w-full bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white py-3 pl-12 pr-6 rounded-2xl text-lg shadow-sm border-transparent focus:border-harvest-green outline-none transition" placeholder="Search food..." oninput="handleSearch(this.value)">
                    </div>
                    <div id="listings-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        ${window.STATE.listings.filter(l => l.foodName.toLowerCase().includes(window.STATE.searchQuery)).map(l => ListingCard(l)).join('') || '<p class="col-span-full text-center opacity-50">No matches found.</p>'} 
                    </div>
                </div>`;
            } 
            
            else if(window.STATE.currentPage === 'orders') {
                const myOrders = window.STATE.reservations || [];
                contentHTML = `
                <div class="p-6 max-w-3xl mx-auto w-full">
                    <h2 class="text-2xl font-bold mb-6">My Order History</h2>
                    <div class="space-y-4">
                        ${myOrders.length ? myOrders.map(r => OrderCard(r)).join('') : '<p class="opacity-50 text-center py-10">You haven\'t bought any food yet.</p>'}
                    </div>
                </div>`;
            }

            else if(window.STATE.currentPage === 'profile') {
                contentHTML = `
                <div class="p-6 max-w-md mx-auto w-full">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-8 rounded-2xl space-y-6 text-center shadow-sm">
                        <h2 class="text-2xl font-bold">Edit Profile</h2>
                        
                        <div class="relative w-32 h-32 mx-auto rounded-full overflow-hidden border-4 border-slate-200 dark:border-slate-700 group">
                            <img id="image-preview" src="${window.STATE.tempImage || window.STATE.user.avatar || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center cursor-pointer">
                                <i class="ph-bold ph-camera text-white text-2xl"></i>
                                <input type="file" accept="image/*" onchange="handleImageUpload(this)" class="absolute inset-0 opacity-0 cursor-pointer">
                            </div>
                        </div>

                        <div class="text-left">
                            <label class="text-xs font-bold uppercase opacity-70">Username</label>
                            <input class="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white p-3 rounded-lg mt-1 opacity-50 cursor-not-allowed" value="${window.STATE.user.username}" disabled>
                        </div>

                        <div class="text-left">
                            <label class="text-xs font-bold uppercase opacity-70">Bio</label>
                            <textarea id="bioInput" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white p-3 rounded-lg mt-1 outline-none focus:border focus:border-harvest-green" rows="3" placeholder="Tell us about yourself...">${window.STATE.user.bio || ''}</textarea>
                        </div>

                        <button onclick="updateProfile()" class="w-full bg-harvest-green text-white font-bold py-3 rounded-xl hover:bg-green-600 transition">Save Changes</button>
                    </div>
                </div>`;
            }

            else if(window.STATE.currentPage === 'rewards') {
                const rewards = [{name: "RM 5 Voucher", cost: 100, icon: "ph-ticket"}, {name: "Free Delivery", cost: 200, icon: "ph-truck"}, {name: "Eco Set", cost: 500, icon: "ph-plant"}];
                contentHTML = `
                <div class="p-6 max-w-4xl mx-auto w-full">
                    <h2 class="text-2xl font-bold mb-6 text-center">Redeem Rewards</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${rewards.map(r => RewardCard(r)).join('')}
                    </div>
                </div>`;
            } 
            
            else if(window.STATE.currentPage === 'seller-analytics') {
                const mySales = window.STATE.reservations || [];
                const stats = calculateAnalytics(mySales);
                const myListings = window.STATE.listings.filter(l => l.sellerId === window.STATE.user.sellerId);
                contentHTML = `
                <div class="p-6 max-w-4xl mx-auto w-full space-y-8">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl border-l-4 border-harvest-green shadow-sm"><p class="text-[10px] font-bold uppercase opacity-70">Revenue</p><p class="text-2xl font-black mt-1">RM ${stats.totalRevenue.toFixed(2)}</p></div>
                        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl border-l-4 border-sky-blue shadow-sm"><p class="text-[10px] font-bold uppercase opacity-70">Sales</p><p class="text-2xl font-black mt-1">${stats.totalSales}</p></div>
                        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl border-l-4 border-warn-yellow shadow-sm"><p class="text-[10px] font-bold uppercase opacity-70">Avg Order</p><p class="text-2xl font-black mt-1">RM ${stats.avgOrderValue.toFixed(2)}</p></div>
                        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl border-l-4 border-purple-500 shadow-sm"><p class="text-[10px] font-bold uppercase opacity-70">Top Item</p><p class="text-lg font-black mt-1 truncate">${stats.topItem}</p></div>
                    </div>
                    <div><h2 class="text-xl font-bold mb-4">Recent Sales</h2><div class="space-y-3">${mySales.length ? mySales.map(order => SalesCard(order)).join('') : '<p class="opacity-50 italic">No sales yet.</p>'}</div></div>
                    <div><div class="flex justify-between items-center mb-4 mt-8"><h2 class="text-xl font-bold">Active Listings</h2><button onclick="handlePageChange('seller-add')" class="bg-harvest-green text-white px-4 py-2 rounded-lg font-bold text-sm">+ Add</button></div><div class="space-y-3">${myListings.length ? myListings.map(l => ` <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4 flex gap-4 items-center shadow-sm"><img src="${l.image}" class="w-16 h-16 object-cover rounded-lg"><div class="flex-1"><h3 class="font-bold">${l.foodName}</h3><p class="text-harvest-green font-bold">RM ${(l.originalPrice * (1 - (parseFloat(l.discount)/100 || 0))).toFixed(2)}</p></div><button onclick="deleteListing('${l.id}')" class="text-alert-red hover:text-red-500"><i class="ph-bold ph-trash text-xl"></i></button></div>`).join('') : '<p class="opacity-50">No active listings.</p>'}</div></div>
                </div>`;
            } 
            
            else if(window.STATE.currentPage === 'seller-add') {
                contentHTML = <div class="p-6 max-w-xl mx-auto w-full"><button onclick="handlePageChange('seller-analytics')" class="mb-4 flex items-center gap-2 opacity-70 hover:opacity-100"><i class="ph-bold ph-arrow-left"></i> Back</button><div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-8 rounded-2xl space-y-6 shadow-sm"><h2 class="text-2xl font-bold">New Listing</h2><div class="relative w-full h-40 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600 flex flex-col items-center justify-center cursor-pointer overflow-hidden"><input type="file" accept="image/*" onchange="handleImageUpload(this)" class="absolute inset-0 opacity-0 cursor-pointer z-10"><div id="upload-placeholder" class="text-center opacity-70"><i class="ph ph-camera text-3xl"></i><p class="text-xs mt-2">Upload</p></div><img id="image-preview" class="absolute inset-0 w-full h-full object-cover hidden"></div><div class="grid grid-cols-2 gap-4"><div><label class="text-xs font-bold opacity-70">Name</label><input id="foodName" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white p-3 rounded-lg mt-1 outline-none focus:border focus:border-harvest-green"></div><div><label class="text-xs font-bold opacity-70">Price (RM)</label><input id="originalPrice" type="number" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white p-3 rounded-lg mt-1 outline-none focus:border focus:border-harvest-green"></div></div><div class="grid grid-cols-3 gap-4"><div><label class="text-xs font-bold opacity-70">Discount</label><input id="discount" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white p-3 rounded-lg mt-1" placeholder="20%"></div><div><label class="text-xs font-bold opacity-70">Expiry</label><input id="expiry" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white p-3 rounded-lg mt-1" placeholder="2 days"></div><div><label class="text-xs font-bold opacity-70">Loc</label><input id="location" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white p-3 rounded-lg mt-1" placeholder="Cafe A"></div></div><button onclick="addListing()" class="w-full bg-harvest-green text-white font-bold py-3 rounded-lg hover:bg-green-600">Publish</button></div></div>;
            }
            
            container.innerHTML = headerHTML + contentHTML;
        }
        window.onload = () => { renderApp(); };
    </script>
</body>
</html>
